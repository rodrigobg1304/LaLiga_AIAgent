[project]
name = "football-core"
version = "0.1.0"
description = "Shared library: DB access, config and constants for football services"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mysql-connector-python>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_core"]
